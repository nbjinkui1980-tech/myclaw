[package]
name = "ironclaw_dingtalk_extension"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "DingTalk channel extension for IronClaw Reborn: Stream-mode frame control + ChannelIngress for an enterprise-internal robot"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false
[package.metadata.ironclaw]
layer = "products"
[dependencies]
async-trait = "0.1"
# The package's `ironclaw_*` dependency set is a subset of Slack's: the channel
# boundary contracts only (host_api, extension_contracts). No assistant, no
# registry, no extension host, no network crate.
ironclaw_host_api = { path = "../../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_extension_contracts = { path = "../../../contracts/ironclaw_extension_contracts", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Fixed-reason-code warnings for messages the adapter refuses to admit. Never
# carries an id or message text.
tracing = "0.1"
[dev-dependencies]
# The ignore logs are the only trace a refused message leaves, so they are
# asserted. `no-env-filter` because the robot-code observation is `debug!`.
tracing-test = { version = "0.2", features = ["no-env-filter"] }
# `test-support` exposes the shared channel-adapter conformance fakes.
ironclaw_host_api = { path = "../../../contracts/ironclaw_host_api", version = "0.1.0", features = ["test-support"] }
ironclaw_extension_contracts = { path = "../../../contracts/ironclaw_extension_contracts", version = "0.1.0", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
# The shipped manifest is parsed to pin its channel declaration.
toml = "1.1"
