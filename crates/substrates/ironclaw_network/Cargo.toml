[package]
name = "ironclaw_network"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[features]
# Dev-only seam (`.claude/rules/cargo-features.md` bar: dev-only seam AND a
# privilege boundary). Compiles the env-gated host-rewrite transport used by the
# E2E harnesses. Debug builds get it implicitly, so no lane needs to pass this;
# it exists for a release-PROFILE build that still needs the seam (and for the
# release-profile regression test that proves the refusal arm).
# Production/dist builds enable neither this nor debug_assertions, so the seam
# is not compiled into a shipped binary at all.
test-support = []

[dependencies]
async-trait = "0.1"
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
# The one sanctioned WebSocket client in the workspace (ADR 1.3). TLS must stay
# on the same rustls + native-roots trust as `reqwest` above; no second root
# store. `reborn_runtime_http_egress_has_single_network_boundary` fails any
# other production crate that names this crate.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The WebSocket upgrade is written here, not delegated to `tokio-tungstenite`,
# so the connection ticket in the request line lives only in a scrubbed buffer
# (`websocket/upgrade.rs`); `tokio-tungstenite` keeps the frame layer. That
# makes TLS ours too: the same rustls build, `ring` provider, and native roots
# `reqwest` uses, so these versions track `tokio-tungstenite`'s own.
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
subtle = "2"
tokio-rustls = { version = "0.26", default-features = false }
tracing = "0.1"
url = "2"
zeroize = "1"

[dev-dependencies]
# Mints the throwaway certificate for the in-process TLS handshake test.
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util"] }
